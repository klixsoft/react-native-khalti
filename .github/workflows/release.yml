name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then TAG=next; else TAG=latest; fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            echo "Publishing with the NPM_TOKEN secret"
          else
            echo "Publishing with npm Trusted Publishing (OIDC)"
          fi
          npm --version
          npm publish --access public --provenance --tag "$TAG"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS=--prerelease; else FLAGS=; fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $FLAGS
        env:
          GH_TOKEN: ${{ github.token }}
